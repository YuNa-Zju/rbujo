[package]
name = "rbullet-journal"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22.1"
bcrypt = "0.19.2"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
hmac = "0.13.0"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
mime_guess = "2.0.5"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "macros"] }
thiserror = "2.0.18"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "fs", "net", "signal"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
zip = { version = "8.6.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSError", "NSString"] }
